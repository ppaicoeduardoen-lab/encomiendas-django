# ── Conectividad y Red ───────────────────────────────────────────
bind 0.0.0.0
# escuchar en todas las interfaces
port 6379
tcp-keepalive 60
# mantener conexiones activas
tcp-backlog 511

# ── Memoria ──────────────────────────────────────────────────────
maxmemory 256mb
# limite de RAM para Redis
maxmemory-policy allkeys-lru
# cuando llega al limite: eliminar las claves menos usadas recientemente

# ── Persistencia: RDB (snapshot cada X segundos) ─────────────────
save 900 1
# guardar si hay 1 cambio en 900 segundos
save 300 10
# guardar si hay 10 cambios en 300 segundos
save 60 10000
# guardar si hay 10000 cambios en 60 segundos
dbfilename dump.rdb
dir /data
# directorio del volumen Docker

# ── Logs ─────────────────────────────────────────────────────────
loglevel notice
# notice: mensajes importantes
logfile ""
# "" = stdout (visible en docker logs)

# ── Bases de datos ───────────────────────────────────────────────
databases 16
# 16 bases de datos (0-15)
# Channels usa la BD 1 (REDIS_URL ...redis:6379/1)

# ── Timeouts ─────────────────────────────────────────────────────
timeout 0
# 0 = no cerrar conexiones inactivas
stop-writes-on-bgsave-error yes
# Comprimir el archivo RDB
rdbcompression yes
# ── Comentario sobre AOF para Channels ───────────────────────────
# Para Django Channels NO se recomienda AOF:
# Los mensajes del channel layer son efimeros (expiran en 60s).
# Un AOF de mensajes de WebSocket crece rapidamente y no aporta valor.
# El RDB es suficiente: si Redis se reinicia, los consumers
# se reconectan y generan nuevos grupos automaticamente.
appendonly no